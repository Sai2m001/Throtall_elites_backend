spring.application.name=motorbikebackend
server.port=8080

app.test.property=hello-from-properties

spring.datasource.url=jdbc:postgresql://localhost:5432/motorbike_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.upload.dir=${user.dir}/uploads

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.debug=true

jwt.secret=mySuperSecretJWTKeyForHS512Signing1234567890abcdefghijklmnopqrstuvwxyz1234567890abcdef
jwt.expiration=86400000

logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.bca6th.project.motorbikebackend=DEBUG

spring.main.allow-bean-definition-overriding=true
spring.devtools.restart.enabled=true

spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true